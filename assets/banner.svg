<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="matrix-gap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <text x="72" y="118" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="-2">matrix-gap</text>
  <text x="74" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">claimed support vs. tested reality</text>
  <text x="74" y="214" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">zero dependencies · static · CI-native · Python 3.10–3.14</text>

  <g transform="translate(760 56)">
    <rect x="0" y="0" width="368" height="188" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="34" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">build matrix</text>
    <!-- 4 columns x 5 rows of cells -->
    <g>
      <rect x="24" y="52" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.85"/>
      <rect x="90" y="52" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.85"/>
      <rect x="156" y="52" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.85"/>
      <rect x="222" y="52" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>

      <rect x="24" y="82" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.7"/>
      <rect x="90" y="82" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.7"/>
      <rect x="156" y="82" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <rect x="222" y="82" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>

      <rect x="24" y="112" width="56" height="20" rx="4" fill="#1d4ed8" opacity="0.55"/>
      <rect x="90" y="112" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <rect x="156" y="112" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <rect x="222" y="112" width="56" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-dasharray="4 3"/>

      <rect x="24" y="142" width="56" height="20" rx="4" fill="#334155" stroke="#ef4444" stroke-dasharray="4 3"/>
      <rect x="90" y="142" width="56" height="20" rx="4" fill="#334155" stroke="#ef4444" stroke-dasharray="4 3"/>
      <rect x="156" y="142" width="56" height="20" rx="4" fill="#334155" stroke="#ef4444" stroke-dasharray="4 3"/>
      <rect x="222" y="142" width="56" height="20" rx="4" fill="#334155" stroke="#ef4444" stroke-dasharray="4 3"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect x="292" y="52" width="12" height="12" rx="2" fill="#1d4ed8"/>
      <text x="310" y="62" fill="#94a3b8">tested</text>
      <rect x="292" y="74" width="12" height="12" rx="2" fill="#334155" stroke="#f59e0b" stroke-dasharray="3 2"/>
      <text x="310" y="84" fill="#94a3b8">gap</text>
      <rect x="292" y="96" width="12" height="12" rx="2" fill="#334155" stroke="#ef4444" stroke-dasharray="3 2"/>
      <text x="310" y="106" fill="#94a3b8">claim</text>
    </g>
    <text x="24" y="176" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">3 versions claimed · 1 OS untested</text>
  </g>
</svg>
