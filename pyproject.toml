[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-gap"
version = "0.1.0"
description = "Audit claimed platform support against the CI matrix that actually tests it."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "muguang1224" }]
keywords = ["ci", "github-actions", "matrix", "audit", "static-analysis", "zero-dependencies"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/muguang1224/matrix-gap"

[project.scripts]
matrix-gap = "matrix_gap:main"

[tool.setuptools]
py-modules = ["matrix_gap"]
